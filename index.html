<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Xブックマーク一覧ビューア（タブ10）</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
    }

    /* タブ */
    #tabs {
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 8px;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .tab-wrapper {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .tab-button {
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      background: #eee;
      cursor: pointer;
      border-radius: 4px 4px 0 0;
    }
    .tab-button.active {
      background: #fff;
      border-bottom-color: #fff;
      font-weight: bold;
    }
    .tab-edit {
      padding: 4px 6px;
      font-size: 11px;
      border: 1px solid #ccc;
      background: #fafafa;
      cursor: pointer;
      border-radius: 4px;
    }

    #input-area {
      background: #fff;
      padding: 12px;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
      flex-wrap: wrap;
    }
    #tweetUrl {
      flex: 1;
      min-width: 260px;
      padding: 8px;
      font-size: 14px;
    }
    button {
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    #count {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
    }
    #list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 行レイアウト：左600 / 右320 固定 */
    .tweet-item {
      width: 960px;
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      background: #fff;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 0 4px rgba(0,0,0,0.08);
    }
    .tweet-main {
      flex: 0 0 600px;
      width: 600px;
    }
    .memo-area {
      flex: 0 0 320px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    iframe {
      width: 100%;
      max-width: 100%;
      border: none;
      overflow: hidden;
    }

    .tweet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 12px;
      color: #666;
    }
    .tweet-url {
      word-break: break-all;
      font-size: 11px;
      color: #999;
      margin-bottom: 4px;
    }
    .btn-delete {
      background: #eee;
      border: none;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-delete:hover {
      background: #ffdddd;
    }

    .tweet-data {
      font-size: 12px;
      margin-top: 4px;
      padding: 6px 8px;
      background: #f0f7ff;
      border-radius: 4px;
      border: 1px solid #d0e0f0;
    }
    .tweet-data-user {
      font-size: 11px;
      color: #555;
      margin-bottom: 2px;
      font-weight: bold;
    }
    .tweet-data-text {
      white-space: pre-wrap;
      word-break: break-all;
      color: #333;
    }
    .tweet-data-date {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    .btn-fetch {
      background: #e8f0fe;
      border: 1px solid #c0d0e0;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
    }
    .btn-fetch:hover {
      background: #d0e0f0;
    }

    .memo-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .memo-text {
      width: 100%;
      font-size: 12px;
      padding: 6px;
      box-sizing: border-box;
      resize: none;
      overflow-y: auto;
    }
    .mark-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
    }
    .memo-controls {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      justify-content: flex-end;
    }
    .memo-save {
      align-self: flex-end;
      font-size: 12px;
      padding: 4px 10px;
    }
    .memo-saved {
      font-size: 11px;
      color: #008000;
    }
  </style>
</head>
<body>
  <h1>Xブックマーク一覧ビューア（タブ10）</h1>

  <div id="tabs"></div>

  <div id="input-area">
    <input id="tweetUrl" type="text" placeholder="ツイートのURLをペースト（複数URL可）">
    <button id="addBtn">追加</button>
    <button id="exportBtn">JSONエクスポート</button>
    <button id="importBtn">JSONインポート</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button id="fetchAllBtn">一括テキスト取得</button>
    <button id="csvExportBtn">CSV出力</button>
    <button id="copyAllBtn">一括コピー</button>
  </div>

  <div id="count"></div>
  <div id="list"></div>

<script>
const TABS_KEY  = "tweetTabs_v1";
const OLD_KEY   = "tweetUrls_simple_v1";
const TAB_COUNT = 10;  // ★ ここを 10 に

let appState = initState();

/* ===== 初期化 ===== */
function initState() {
  const rawTabs = localStorage.getItem(TABS_KEY);
  if (rawTabs) {
    try {
      const parsed = JSON.parse(rawTabs);
      let tabs        = Array.isArray(parsed.tabs) ? parsed.tabs : [];
      let activeIndex = Number.isInteger(parsed.activeIndex) ? parsed.activeIndex : 0;

      tabs = normalizeTabs(tabs);
      while (tabs.length < TAB_COUNT) {
        tabs.push({ name: `タブ${tabs.length+1}`, items: [] });
      }
      if (tabs.length > TAB_COUNT) tabs = tabs.slice(0, TAB_COUNT);
      if (activeIndex < 0 || activeIndex >= tabs.length) activeIndex = 0;

      const s = { tabs, activeIndex };
      saveState(s);
      return s;
    } catch {}
  }

  // 旧フォーマットから移行
  let firstItems = [];
  const old = localStorage.getItem(OLD_KEY);
  if (old) {
    try { firstItems = normalizeItems(JSON.parse(old)); } catch {}
  }

  const tabs = [];
  tabs.push({ name: "タブ1", items: firstItems });
  for (let i = 1; i < TAB_COUNT; i++) {
    tabs.push({ name: `タブ${i+1}`, items: [] });
  }

  const s = { tabs, activeIndex: 0 };
  saveState(s);
  return s;
}

function normalizeItems(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map(x => {
    if (typeof x === "string") return { url: x, memo: "", height: 600, text: "", date: "", userName: "", screenName: "" };
    return {
      url: x.url,
      memo: x.memo || "",
      height: typeof x.height === "number" ? x.height : 600,
      text: x.text || "",
      date: x.date || "",
      userName: x.userName || "",
      screenName: x.screenName || ""
    };
  });
}

function normalizeTabs(tabs) {
  return tabs.map(t => ({
    name: (t.name || "").trim() || "タブ",
    items: normalizeItems(t.items || [])
  }));
}

function saveState(s) {
  localStorage.setItem(TABS_KEY, JSON.stringify(s));
}

function getCurrentTab()   { return appState.tabs[appState.activeIndex]; }
function getCurrentItems() { return getCurrentTab().items; }

function setCurrentItems(items) {
  appState.tabs[appState.activeIndex].items = items;
  saveState(appState);
}

/* ===== タブ描画 ===== */
function renderTabs() {
  const tabsDiv = document.getElementById("tabs");
  tabsDiv.innerHTML = "";
  appState.tabs.forEach((tab, i) => {
    const wrap = document.createElement("div");
    wrap.className = "tab-wrapper";

    const btn = document.createElement("button");
    btn.className = "tab-button" + (i === appState.activeIndex ? " active" : "");
    btn.textContent = tab.name;
    btn.onclick = () => {
      appState.activeIndex = i;
      saveState(appState);
      renderTabs();
      renderList();
    };

    const edit = document.createElement("button");
    edit.className = "tab-edit";
    edit.textContent = "✎";
    edit.onclick = ev => {
      ev.stopPropagation();
      const name = prompt("タブ名を入力", tab.name);
      if (!name) return;
      appState.tabs[i].name = name;
      saveState(appState);
      renderTabs();
      updateCount();
    };

    wrap.appendChild(btn);
    wrap.appendChild(edit);
    tabsDiv.appendChild(wrap);
  });
}

function updateCount() {
  const items = getCurrentItems();
  const tabName = getCurrentTab().name;
  document.getElementById("count").textContent =
    `${tabName} の保存件数: ${items.length} 件`;
}

/* ===== ツイート埋め込み ===== */
function extractTweetId(url) {
  if (!url) return null;
  if (!url.startsWith("http")) url = "https://" + url;
  const m = url.match(/status\/(\d+)/);
  return m ? m[1] : null;
}

/* ===== ツイートデータ取得 ===== */
async function fetchTweetData(tweetId) {
  const url = "https://api.fxtwitter.com/i/status/" + tweetId;
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (!data.tweet) throw new Error("ツイートが見つかりません");
  const tweet = data.tweet;
  let dateStr = "";
  if (tweet.created_timestamp) {
    dateStr = new Date(tweet.created_timestamp * 1000).toISOString();
  } else if (tweet.created_at) {
    dateStr = tweet.created_at;
  }
  return {
    text: tweet.text || "",
    date: dateStr,
    userName: (tweet.author && tweet.author.name) || "",
    screenName: (tweet.author && tweet.author.screen_name) || ""
  };
}

function formatTweetDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "/" + pad(d.getMonth()+1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

async function fetchAllTweetData() {
  const btn = document.getElementById("fetchAllBtn");
  const arr = getCurrentItems();
  let updated = 0;
  let errors = 0;
  btn.textContent = "取得中... (0/" + arr.length + ")";
  btn.disabled = true;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i].text) { continue; }
    const tid = extractTweetId(arr[i].url);
    if (!tid) { errors++; continue; }
    try {
      const data = await fetchTweetData(tid);
      arr[i].text = data.text;
      arr[i].date = data.date;
      arr[i].userName = data.userName;
      arr[i].screenName = data.screenName;
      updated++;
      btn.textContent = "取得中... (" + (updated + errors) + "/" + arr.length + ")";
    } catch (e) {
      console.error("fetchTweetData error:", e);
      errors++;
    }
  }
  if (updated > 0) {
    setCurrentItems(arr);
    renderList();
  }
  btn.textContent = "一括テキスト取得";
  btn.disabled = false;
  alert(updated + "件取得しました" + (errors > 0 ? "（" + errors + "件エラー）" : ""));
}

function exportCsv() {
  const arr = getCurrentItems();
  const hasData = arr.some(x => x.text);
  if (!hasData) {
    alert("テキストデータがありません。先に「一括テキスト取得」を実行してください。");
    return;
  }
  const header = "ユーザー名,スクリーンネーム,日付,URL,テキスト";
  const rows = arr.map(it => {
    const cells = [
      csvEscape(it.userName),
      csvEscape(it.screenName ? "@" + it.screenName : ""),
      csvEscape(formatTweetDate(it.date)),
      csvEscape(it.url),
      csvEscape(it.text)
    ];
    return cells.join(",");
  });
  const csv = "\uFEFF" + header + "\n" + rows.join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });

  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const name = getCurrentTab().name.replace(/[\\\/:*?"<>|]/g, "_");
  const fname = "x_tab_" + name + "_" + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + "_" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds()) + ".csv";

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);
}

function csvEscape(val) {
  if (val == null) return "";
  const s = String(val);
  if (s.includes(",") || s.includes('"') || s.includes("\n") || s.includes("\r")) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function copyAllTweetData() {
  const arr = getCurrentItems();
  const hasData = arr.some(x => x.text);
  if (!hasData) {
    alert("テキストデータがありません。先に「一括テキスト取得」を実行してください。");
    return;
  }
  const lines = arr.map((it, i) => {
    const parts = [];
    parts.push("[" + (i+1) + "]");
    if (it.userName) parts.push(it.userName + " (@" + it.screenName + ")");
    if (it.date) parts.push(formatTweetDate(it.date));
    parts.push(it.url);
    if (it.text) parts.push(it.text);
    return parts.join("\n");
  });
  const text = lines.join("\n\n---\n\n");
  navigator.clipboard.writeText(text).then(() => {
    alert("クリップボードにコピーしました（" + arr.length + "件）");
  }).catch(() => {
    alert("コピーに失敗しました");
  });
}

function createTweetItem(item, index) {
  const root = document.createElement("div");
  root.className = "tweet-item";

  /* 左：ツイート */
  const main = document.createElement("div");
  main.className = "tweet-main";

  const head = document.createElement("div");
  head.className = "tweet-header";
  head.innerHTML = `<span>#${index + 1}</span>`;

  const headBtns = document.createElement("div");
  headBtns.style.display = "flex";
  headBtns.style.gap = "4px";

  const fetchBtn = document.createElement("button");
  fetchBtn.className = "btn-fetch";
  fetchBtn.textContent = item.text ? "再取得" : "テキスト取得";
  fetchBtn.onclick = async () => {
    const tid = extractTweetId(item.url);
    if (!tid) { alert("ツイートIDが取得できません"); return; }
    fetchBtn.textContent = "取得中...";
    fetchBtn.disabled = true;
    try {
      const data = await fetchTweetData(tid);
      const arr = getCurrentItems();
      arr[index].text = data.text;
      arr[index].date = data.date;
      arr[index].userName = data.userName;
      arr[index].screenName = data.screenName;
      setCurrentItems(arr);
      renderList();
    } catch (e) {
      alert("取得エラー: " + e.message);
      fetchBtn.textContent = item.text ? "再取得" : "テキスト取得";
      fetchBtn.disabled = false;
    }
  };

  const del = document.createElement("button");
  del.className = "btn-delete";
  del.textContent = "削除";
  del.onclick = () => {
    const arr = getCurrentItems();
    arr.splice(index, 1);
    setCurrentItems(arr);
    renderList();
  };

  headBtns.appendChild(fetchBtn);
  headBtns.appendChild(del);
  head.appendChild(headBtns);

  const urlText = document.createElement("div");
  urlText.className = "tweet-url";
  urlText.textContent = item.url;

  const embed = document.createElement("div");
  const tid = extractTweetId(item.url);
  let iframe = null;
  if (tid) {
    iframe = document.createElement("iframe");
    iframe.src = "https://platform.twitter.com/embed/Tweet.html?id=" + tid;
    iframe.scrolling = "no";
    iframe.loading = "lazy";
    embed.appendChild(iframe);
  } else {
    embed.textContent = "ツイートIDエラー";
  }

  main.appendChild(head);
  main.appendChild(urlText);
  main.appendChild(embed);

  if (item.text) {
    const dataDiv = document.createElement("div");
    dataDiv.className = "tweet-data";
    if (item.userName) {
      const userDiv = document.createElement("div");
      userDiv.className = "tweet-data-user";
      userDiv.textContent = item.userName + " @" + item.screenName;
      dataDiv.appendChild(userDiv);
    }
    const textDiv = document.createElement("div");
    textDiv.className = "tweet-data-text";
    textDiv.textContent = item.text;
    dataDiv.appendChild(textDiv);
    if (item.date) {
      const dateDiv = document.createElement("div");
      dateDiv.className = "tweet-data-date";
      dateDiv.textContent = formatTweetDate(item.date);
      dataDiv.appendChild(dateDiv);
    }
    main.appendChild(dataDiv);
  }

  /* 右：メモ */
  const memoBox = document.createElement("div");
  memoBox.className = "memo-area";

  const label = document.createElement("div");
  label.className = "memo-label-row";
  label.textContent = "メモ";
  memoBox.appendChild(label);

  /* 並び替え＆高さ調整ボタン（↑ ↓ +20 -20） */
  const ctr = document.createElement("div");
  ctr.className = "memo-controls";

  const upBtn   = document.createElement("button");
  const downBtn = document.createElement("button");
  const plus    = document.createElement("button");
  const minus   = document.createElement("button");

  upBtn.textContent   = "↑";
  downBtn.textContent = "↓";
  plus.textContent    = "+20";
  minus.textContent   = "-20";

  ctr.appendChild(upBtn);
  ctr.appendChild(downBtn);
  ctr.appendChild(plus);
  ctr.appendChild(minus);
  memoBox.appendChild(ctr);

  const ta = document.createElement("textarea");
  ta.className = "memo-text";
  ta.value = item.memo;
  memoBox.appendChild(ta);

  const marks = document.createElement("div");
  marks.className = "mark-buttons";
  ["★","●","▲","■"].forEach(m => {
    const b = document.createElement("button");
    b.textContent = m;
    b.onclick = () => { ta.value += m; };
    marks.appendChild(b);
  });
  memoBox.appendChild(marks);

  const bottom = document.createElement("div");
  bottom.style.display = "flex";
  bottom.style.justifyContent = "space-between";
  bottom.style.alignItems   = "center";

  const saved = document.createElement("span");
  saved.className = "memo-saved";

  const saveBtn = document.createElement("button");
  saveBtn.className = "memo-save";
  saveBtn.textContent = "保存";

  bottom.appendChild(saved);
  bottom.appendChild(saveBtn);
  memoBox.appendChild(bottom);

  root.appendChild(main);
  root.appendChild(memoBox);

  /* 高さ制御 */
  let h = item.height || 600;
  function apply(save) {
    if (iframe) iframe.style.height = h + "px";
    ta.style.height = Math.max(60, Math.floor(h * 0.8)) + "px";
    if (save) {
      const arr = getCurrentItems();
      arr[index].height = h;
      setCurrentItems(arr);
    }
  }
  plus.onclick  = () => { h += 20; apply(true); };
  minus.onclick = () => { h -= 20; apply(true); };

  /* 並び替え（上下入れ替え） */
  upBtn.onclick = () => {
    const arr = getCurrentItems();
    if (index <= 0) return;
    const tmp = arr[index - 1];
    arr[index - 1] = arr[index];
    arr[index]     = tmp;
    setCurrentItems(arr);
    renderList();
  };
  downBtn.onclick = () => {
    const arr = getCurrentItems();
    if (index >= arr.length - 1) return;
    const tmp = arr[index + 1];
    arr[index + 1] = arr[index];
    arr[index]     = tmp;
    setCurrentItems(arr);
    renderList();
  };

  saveBtn.onclick = () => {
    const arr = getCurrentItems();
    arr[index].memo = ta.value;
    setCurrentItems(arr);
    saved.textContent = "保存しました";
    setTimeout(() => { saved.textContent = ""; }, 1200);
  };

  apply(false);
  return root;
}

/* ===== リスト描画 ===== */
function renderList() {
  const arr  = getCurrentItems();
  const list = document.getElementById("list");
  list.innerHTML = "";
  arr.forEach((it, i) => list.appendChild(createTweetItem(it, i)));
  updateCount();
}

/* ===== 追加＆入出力 ===== */
function addItem() {
  const inp = document.getElementById("tweetUrl");
  const text = inp.value.trim();
  if (!text) return;

  // 複数URLを分割（https://の前で分割し、各URLを抽出）
  const lines = text
    .split(/(?=https?:\/\/)/)
    .map(s => s.trim())
    .filter(l => l);
  if (lines.length === 0) return;

  const arr = getCurrentItems();
  let added = 0;
  let skipped = 0;

  // 逆順で処理（最初のURLが一番上に来るように）
  for (let i = lines.length - 1; i >= 0; i--) {
    let url = lines[i];
    if (!url.startsWith("http")) url = "https://" + url;

    if (arr.some(x => x.url === url)) {
      skipped++;
      continue;
    }
    arr.unshift({ url, memo: "", height: 600, text: "", date: "", userName: "", screenName: "" });
    added++;
  }

  if (added > 0) {
    setCurrentItems(arr);
    renderList();
  }

  inp.value = "";

  // 結果をフィードバック
  if (skipped > 0 && added === 0) {
    alert(`${skipped}件すべて登録済みです`);
  } else if (skipped > 0) {
    alert(`${added}件追加しました（${skipped}件は登録済みのためスキップ）`);
  }
}

function exportJson() {
  const arr  = getCurrentItems();
  const text = JSON.stringify(arr, null, 2);
  const blob = new Blob([text], { type: "application/json" });

  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const name = getCurrentTab().name.replace(/[\\\/:*?"<>|]/g, "_");
  const fname =
    `x_tab_${name}_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.json`;

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);
}

function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const rd = new FileReader();
  rd.onload = () => {
    try {
      const arr = JSON.parse(rd.result);
      if (!Array.isArray(arr)) {
        alert("配列形式ではありません");
        return;
      }
      setCurrentItems(normalizeItems(arr));
      renderList();
    } catch {
      alert("JSON解析エラー");
    }
  };
  rd.readAsText(file);
  e.target.value = "";
}

/* ===== タブ切り替えショートカット ===== */
/* 1〜9 → タブ1〜9, 0 → タブ10 */
function handleTabShortcut(e) {
  const tag = (e.target.tagName || "").toUpperCase();
  if (tag === "INPUT" || tag === "TEXTAREA") return; // 入力中は無効

  let idx = null;
  if (e.key >= "1" && e.key <= "9") {
    idx = parseInt(e.key, 10) - 1;
  } else if (e.key === "0") {
    idx = 9; // タブ10
  }
  if (idx === null) return;
  if (idx < 0 || idx >= TAB_COUNT) return;

  appState.activeIndex = idx;
  saveState(appState);
  renderTabs();
  renderList();
}

window.onload = () => {
  document.getElementById("addBtn").onclick = addItem;
  document.getElementById("tweetUrl").addEventListener("keydown", e => {
    if (e.key === "Enter") addItem();
  });
  document.getElementById("exportBtn").onclick =
    () => exportJson();
  document.getElementById("importBtn").onclick =
    () => document.getElementById("importFile").click();
  document.getElementById("importFile").addEventListener("change", handleImportFile);
  document.getElementById("fetchAllBtn").onclick = fetchAllTweetData;
  document.getElementById("csvExportBtn").onclick = exportCsv;
  document.getElementById("copyAllBtn").onclick = copyAllTweetData;

  document.addEventListener("keydown", handleTabShortcut);

  renderTabs();
  renderList();
};
</script>
